name: Build macOS DMG

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-mac:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller
          python -m pip install pyobjc-framework-Quartz pyobjc-framework-Vision pyobjc-framework-Cocoa pyobjc-core
          python -m pip install pynput

      - name: Build .app
        run: |
          python -m PyInstaller --noconfirm --clean FloatTrans-macos.spec

      - name: Create DMG
        run: |
          ls -la dist/
          hdiutil create -volname "FloatTrans" -srcfolder "dist/FloatTrans.app" -ov -format UDZO "dist/FloatTrans.dmg"
          ls -la dist/

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: FloatTrans-macOS-dmg
          path: dist/FloatTrans.dmg
          if-no-files-found: error
